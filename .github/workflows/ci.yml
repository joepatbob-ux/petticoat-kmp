name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  shared-and-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Shared tests, Android build, and lint
        run: ./gradlew :shared:jvmTest :androidApp:assembleDebug :androidApp:assembleDebugAndroidTest :androidApp:lintDebug

  ios:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build native SwiftUI app and tests
        run: |
          xcodebuild build-for-testing \
            -project Petticoat.xcodeproj \
            -scheme Petticoat \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            CODE_SIGNING_ALLOWED=NO
      - name: Run native iOS unit tests
        run: |
          xcodebuild test-without-building \
            -project Petticoat.xcodeproj \
            -scheme Petticoat \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:PetticoatTests \
            CODE_SIGNING_ALLOWED=NO
      - name: Run native iOS UI tests
        run: |
          xcodebuild test-without-building \
            -project Petticoat.xcodeproj \
            -scheme Petticoat \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:PetticoatUITests \
            CODE_SIGNING_ALLOWED=NO
